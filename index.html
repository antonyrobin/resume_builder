<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder | Professional Resume Designer</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Summernote Dependencies (keep if needed, but I'll try to use a simple text area for simplicity and better control in templates, or keep summernote for full detail summary) -->
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-lite.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="notifier">Notification message</div>

    <div class="app-container">
        <header>
            <div class="logo">
                <i data-lucide="file-text"></i>
                <span>ResumeBuilder</span>
            </div>
            <div class="header-actions">
                <div class="theme-switch" title="Toggle Dark/Light Mode">
                    <i data-lucide="sun" id="sun-icon"></i>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
                        <span class="slider"></span>
                    </label>
                    <i data-lucide="moon" id="moon-icon"></i>
                </div>
                <button class="btn btn-secondary" onclick="exportJSON()">
                    <i data-lucide="download"></i> Export JSON
                </button>
                <label class="btn btn-secondary" style="margin-bottom: 0;">
                    <i data-lucide="upload"></i> Upload JSON
                    <input type="file" id="upload-json" accept="application/json" style="display: none;" onchange="uploadJSON(event)">
                </label>
                <button class="btn btn-primary" onclick="htmlToPDF()">
                    <i data-lucide="file-down"></i> Export PDF
                </button>
            </div>
        </header>

        <main>
            <!-- FORM SECTION -->
            <aside class="form-section">
                <div class="section-card">
                    <h2 class="section-title">Template & Theme</h2>
                    <div class="form-group">
                        <label for="template-select">Choose Template</label>
                        <select id="template-select" onchange="updatePreview()">
                            <option value="template-classic">Classic Professional</option>
                            <option value="template-modern">Modern Tech</option>
                            <option value="template-creative">Creative Two-Column</option>
                            <option value="template-minimalist">Minimalist Developer</option>
                            <option value="template-executive">Executive Portfolio</option>
                        </select>
                    </div>
                </div>

                <div class="section-card">
                    <h2 class="section-title">Personal Information</h2>
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="John Doe" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label for="photo">Profile Photo</label>
                        <input type="file" id="photo" accept="image/*" onchange="uploadPhoto(event)">
                        <button class="btn btn-danger btn-sm" onclick="removePhoto()" id="remove-photo-btn" style="margin-top: 5px; display: none;">Remove Photo</button>
                    </div>
                    <div class="form-group">
                        <label for="job-title">Job Title</label>
                        <input type="text" id="job-title" placeholder="Senior Software Engineer" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="john@example.com" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" placeholder="+1 (555) 000-0000" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" placeholder="New York, USA" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label for="linkedin">LinkedIn Profile URL</label>
                        <input type="url" id="linkedin" placeholder="https://linkedin.com/in/johndoe" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label for="github">GitHub Profile URL</label>
                        <input type="url" id="github" placeholder="https://github.com/johndoe" oninput="updatePreview()">
                    </div>
                </div>

                <div class="section-card">
                    <h2 class="section-title">Professional Summary</h2>
                    <div class="form-group">
                        <div id="summary_editor"></div>
                        <input type="hidden" id="summary">
                    </div>
                </div>

                <!-- DYNAMIC SECTIONS -->
                <div class="section-card">
                    <h2 class="section-title">Experience</h2>
                    <div id="experience-list"></div>
                    <button class="btn btn-secondary" onclick="addItem('experience')">
                        <i data-lucide="plus"></i> Add Experience
                    </button>
                </div>

                <div class="section-card">
                    <h2 class="section-title">Education</h2>
                    <div id="education-list"></div>
                    <button class="btn btn-secondary" onclick="addItem('education')">
                        <i data-lucide="plus"></i> Add Education
                    </button>
                </div>

                <div class="section-card">
                    <h2 class="section-title">Skills</h2>
                    <div class="form-group">
                        <label for="skills">Skills (Comma separated)</label>
                        <input type="text" id="skills" placeholder="JavaScript, React, Node.js, Python" oninput="updatePreview()">
                    </div>
                </div>

                <div class="section-card">
                    <h2 class="section-title">Projects</h2>
                    <div id="projects-list"></div>
                    <button class="btn btn-secondary" onclick="addItem('projects')">
                        <i data-lucide="plus"></i> Add Project
                    </button>
                </div>

                <div class="section-card">
                    <h2 class="section-title">Courses</h2>
                    <div id="courses-list"></div>
                    <button class="btn btn-secondary" onclick="addItem('courses')">
                        <i data-lucide="plus"></i> Add Course
                    </button>
                </div>

                <div class="section-card">
                    <h2 class="section-title">Certifications</h2>
                    <div id="certificates-list"></div>
                    <button class="btn btn-secondary" onclick="addItem('certificates')">
                        <i data-lucide="plus"></i> Add Certificate
                    </button>
                </div>
            </aside>

            <!-- PREVIEW SECTION -->
            <section class="preview-section">
                <div id="preview-container" class="template-classic">
                    <!-- Preview content will be dynamically generated by JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-lite.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
